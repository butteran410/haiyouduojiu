<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>还有多久｜V10 高德 JS API 测试版</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#17181a}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee;padding:14px 18px}
.header{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:22px;font-weight:800}.city{color:#666;font-size:14px}
.wrap{max-width:1100px;margin:auto;padding:18px}
.notice{background:#fff8e8;border:1px solid #ffe0a3;border-radius:14px;padding:13px 15px;line-height:1.6;font-size:14px}
.controls{background:#fff;border-radius:16px;padding:16px;margin-top:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input,select,button{font:inherit}
input{flex:1;min-width:220px;padding:11px 12px;border:1px solid #ddd;border-radius:10px}
button{border:0;border-radius:10px;padding:11px 15px;background:#1677ff;color:#fff;cursor:pointer}
button.secondary{background:#f1f2f4;color:#333}
button:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:10px;color:#555;font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
select{padding:9px 11px;border:1px solid #ddd;border-radius:9px;background:#fff}
#map{height:380px;margin-top:14px;border-radius:16px;overflow:hidden;background:#e9ecef}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #eee}
.photo{height:150px;background:#eef0f2;display:flex;align-items:center;justify-content:center;font-size:42px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.body{padding:14px}.name{font-size:18px;font-weight:750}.meta{margin-top:7px;color:#666;font-size:13px;line-height:1.55}
.badge{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:7px;background:#f1f2f4;font-size:12px}
.wait{color:#777}
.empty{background:#fff;border-radius:16px;padding:24px;text-align:center;color:#777;margin-top:14px}
.detail{position:fixed;inset:0;background:#0007;display:none;z-index:20;padding:20px}
.detailbox{background:#fff;max-width:620px;margin:auto;max-height:90vh;overflow:auto;border-radius:18px}
.detailhead{padding:16px;display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #eee}
.detailbody{padding:18px}.detailphoto{width:100%;height:230px;object-fit:cover;border-radius:12px;background:#eee}
@media(max-width:600px){.wrap{padding:12px}#map{height:320px}.detail{padding:8px}.detailbox{max-height:95vh}}
</style>
</head>
<body>
<header><div class="header"><div><div class="logo">还有多久</div><div class="city" id="city">正在定位附近餐厅…</div></div><button class="secondary" onclick="locate()">重新定位</button></div></header>

<main class="wrap">
<div class="notice">
<strong>V10 测试版</strong>：这一版用高德 JS API 直接在 GitHub Pages 获取定位和附近餐厅。
<br>⚠️ 这是测试环境。安全密钥只在当前浏览器内存中使用，<strong>不要把它写入 GitHub 或发给别人。</strong>
</div>

<section class="controls">
<div class="row">
<input id="key" autocomplete="off" placeholder="输入“还有多久网页”的 Key">
<input id="secret" type="password" autocomplete="off" placeholder="输入对应 securityJsCode">
<button id="start" onclick="start()">连接高德</button>
</div>
<div class="status" id="status">等待连接高德 JS API…</div>
<div class="filters">
<select id="rating" onchange="render()"><option value="">全部评分</option><option value="4.5">4.5分以上</option><option value="4">4.0分以上</option></select>
<select id="sort" onchange="render()"><option value="distance">距离最近</option><option value="rating">评分最高</option></select>
<select id="radius" onchange="searchNearby()"><option value="3000">3公里内</option><option value="5000" selected>5公里内</option><option value="8000">8公里内</option></select>
</div>
</section>

<div id="map"></div>
<div id="list" class="grid"></div>
</main>

<div class="detail" id="detail" onclick="if(event.target===this)closeDetail()">
<div class="detailbox">
<div class="detailhead"><strong id="dname">餐厅详情</strong><button class="secondary" onclick="closeDetail()">关闭</button></div>
<div class="detailbody" id="dbody"></div>
</div>
</div>

<script>
let AMap=null,map=null,placeSearch=null,pois=[],current={lng:null,lat:null};

function $(id){return document.getElementById(id)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setStatus(s){$("status").textContent=s}

async function start(){
  const key=$("key").value.trim(), secret=$("secret").value.trim();
  if(!key||!secret){setStatus("请填写 Key 和 securityJsCode。");return}
  $("start").disabled=true; setStatus("正在加载高德 JS API…");
  window._AMapSecurityConfig={securityJsCode:secret};
  try{
    if(!window.AMapLoader){
      await new Promise((resolve,reject)=>{
        const s=document.createElement("script");
        s.src="https://webapi.amap.com/loader.js";
        s.onload=resolve;s.onerror=()=>reject(new Error("高德 Loader 加载失败"));
        document.head.appendChild(s);
      });
    }
    AMap=await AMapLoader.load({key,version:"2.0"});
    setStatus("高德鉴权成功，正在获取当前位置…");
    locate();
  }catch(e){
    $("start").disabled=false;setStatus("❌ "+(e.message||e));
  }
}

function locate(){
  if(!AMap){setStatus("请先点击“连接高德”。");return}
  if(!navigator.geolocation){setStatus("当前浏览器不支持定位。");return}
  setStatus("正在获取当前位置…");
  navigator.geolocation.getCurrentPosition(
    p=>{current.lng=p.coords.longitude;current.lat=p.coords.latitude;initMap();searchNearby()},
    e=>setStatus("❌ 定位失败："+e.message),
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000}
  )
}

function initMap(){
  if(!map) map=new AMap.Map("map",{zoom:14,center:[current.lng,current.lat]});
  else map.setCenter([current.lng,current.lat]);
  map.clearMap();
  new AMap.Marker({map,position:[current.lng,current.lat],title:"我的位置"});
  $("city").textContent="已定位 · 正在搜索附近餐厅";
}

function searchNearby(){
  if(!AMap||current.lng==null)return;
  const radius=Number($("radius").value);
  setStatus("正在搜索附近真实餐厅…");
  AMap.plugin("AMap.PlaceSearch",()=>{
    if(!placeSearch) placeSearch=new AMap.PlaceSearch({pageSize:25,pageIndex:1,type:"餐饮服务"});
    placeSearch.searchNearBy("",[current.lng,current.lat],radius,(status,result)=>{
      if(status!=="complete"){
        setStatus("❌ 餐厅搜索失败："+(result?.info||status||"未知错误"));
        $("list").innerHTML=`<div class="empty">餐厅搜索失败：${esc(result?.info||status||"未知错误")}</div>`;
        return
      }
      pois=result.poiList?.pois||[];
      drawMarkers();render();
      $("city").textContent=`附近 ${pois.length} 家餐厅`;
      setStatus(pois.length
        ? `✅ 已找到 ${pois.length} 家附近真实餐厅`
        : "⚠️ 搜索成功，但当前范围没有返回餐厅");
    })
  })
}

function drawMarkers(){
  if(!map)return;
  map.clearMap();
  new AMap.Marker({map,position:[current.lng,current.lat],title:"我的位置"});
  pois.forEach((p,i)=>{
    const loc=(p.location||"").split(",");
    if(loc.length<2)return;
    const marker=new AMap.Marker({map,position:[Number(loc[0]),Number(loc[1])],title:p.name});
    marker.on("click",()=>openDetail(i));
  })
}

function render(){
  const min=Number($("rating").value||0);
  let arr=pois.filter(p=>Number(p.rating||0)>=min);
  if($("sort").value==="rating")arr.sort((a,b)=>Number(b.rating||0)-Number(a.rating||0));
  else arr.sort((a,b)=>Number(a.distance||999999)-Number(b.distance||999999));
  if(!arr.length){$("list").innerHTML='<div class="empty">没有符合筛选条件的餐厅</div>';return}
  $("list").innerHTML=arr.map(p=>{
    const idx=pois.indexOf(p), photo=p.photos?.[0]?.url||"";
    return `<article class="card" onclick="openDetail(${idx})">
      <div class="photo">${photo?`<img src="${esc(photo)}" alt="">`:"🍽️"}</div>
      <div class="body">
        <div class="name">${esc(p.name||"未命名餐厅")}</div>
        <div class="meta">⭐ ${p.rating?esc(p.rating):"暂无评分"}　↔ ${p.distance!=null?esc(p.distance)+"米":"距离暂无"}<br>📍 ${esc(p.address||"地址暂无")}</div>
        <span class="badge wait">等位数据：暂未接入</span>
      </div>
    </article>`
  }).join("")
}

function openDetail(i){
  const p=pois[i];if(!p)return;
  $("dname").textContent=p.name||"餐厅详情";
  const photo=p.photos?.[0]?.url||"";
  $("dbody").innerHTML=`
    ${photo?`<img class="detailphoto" src="${esc(photo)}" alt="">`:"<div class='detailphoto' style='display:flex;align-items:center;justify-content:center;font-size:60px'>🍽️</div>"}
    <h2>${esc(p.name||"未命名餐厅")}</h2>
    <p>⭐ ${p.rating?esc(p.rating):"暂无评分"}　📏 ${p.distance!=null?esc(p.distance)+" 米":"距离暂无"}</p>
    <p>📍 ${esc(p.address||"地址暂无")}</p>
    <p>☎ ${esc(p.tel||"暂无")}</p>
    <p>🕒 ${esc(p.business?.opentime_today||"营业时间暂无")}</p>
    <p><strong>当前等位：</strong>暂未接入实时等位数据</p>
    <button onclick="navigate(${Number(p.location?.split(",")[1])},${Number(p.location?.split(",")[0])})">导航</button>
  `;
  $("detail").style.display="block";
}
function closeDetail(){$("detail").style.display="none"}
function navigate(lat,lng){
  if(!Number.isFinite(lat)||!Number.isFinite(lng))return;
  location.href=`https://uri.amap.com/marker?position=${lng},${lat}&name=${encodeURIComponent($("dname").textContent)}`;
}
</script>
</body>
</html>

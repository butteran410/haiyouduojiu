<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>还有多久 V5</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171717;font-family:"Microsoft YaHei",Arial,sans-serif}.app{max-width:1150px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.logo{font-size:28px;font-weight:900}.city{background:#fff;border:1px solid #ddd;border-radius:20px;padding:9px 14px;cursor:pointer}
.hero{background:#171717;color:#fff;border-radius:24px;padding:25px}.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0 0 18px;color:#ccc}.search{display:flex;gap:9px}.search input{flex:1;border:0;border-radius:12px;padding:13px;font-size:15px}.search button,.btn{border:0;border-radius:11px;padding:11px 15px;cursor:pointer;font-weight:700}.search button{background:#fff}.filters{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.filters select{padding:9px 11px;border:0;border-radius:10px}
.location{margin-top:15px;background:#fff;border-radius:18px;padding:15px;display:flex;align-items:center;justify-content:space-between;border:1px solid #e5e5e5}.location strong{font-size:15px}.location small{color:#888}.map{height:125px;margin-top:10px;border-radius:13px;background:linear-gradient(135deg,#e7ece8,#dce5ed);position:relative;overflow:hidden}.road{position:absolute;background:#fff;height:12px;transform:rotate(-18deg);width:120%;top:55px;left:-10%}.road2{position:absolute;background:#fff;height:9px;transform:rotate(24deg);width:120%;top:70px;left:-10%}.pin{position:absolute;left:53%;top:42%;font-size:28px}
.title{display:flex;justify-content:space-between;align-items:center;margin:23px 2px 12px}.title h2{margin:0;font-size:21px}.count{font-size:13px;color:#888}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 15px #0000000b}.photo{height:130px;background:#e8e9eb;display:flex;align-items:center;justify-content:center;font-size:52px}.body{padding:15px}.tag{display:inline-block;background:#f0f1f3;border-radius:7px;padding:4px 8px;font-size:12px;color:#666}.name{font-size:19px;font-weight:800;margin:8px 0}.meta{font-size:13px;color:#666}.bottom{display:flex;justify-content:space-between;align-items:end;margin-top:13px}.wait{font-size:23px;font-weight:900}.wait small{font-size:11px;color:#888;font-weight:400}.green{color:#16803a}.yellow{color:#a66d00}.red{color:#c43b32}.empty{grid-column:1/-1;background:#fff;padding:45px;text-align:center;border-radius:18px;color:#888}
.detail{display:none}.back{border:0;background:transparent;padding:8px 0;color:#555;cursor:pointer}.detailHero{background:#171717;color:#fff;border-radius:22px;overflow:hidden}.detailPhoto{height:220px;background:#e7e8ea;display:flex;align-items:center;justify-content:center;font-size:85px}.detailInfo{padding:22px}.detailName{font-size:29px;font-weight:900;margin:8px 0}.waitBox{margin-top:17px;background:#fff;color:#111;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center}.waitNum{font-size:38px;font-weight:900}.panels{display:grid;grid-template-columns:1.35fr 1fr;gap:15px;margin-top:15px}.panel{background:#fff;border-radius:18px;padding:19px}.panel h2{font-size:18px;margin:0 0 15px}.chart{height:135px;display:flex;align-items:end;gap:9px;border-bottom:1px solid #ddd;padding:0 5px 24px}.bar{flex:1;background:#ddd;border-radius:7px 7px 0 0;position:relative}.bar span{position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:10px;color:#888}.row{padding:11px 0;border-bottom:1px solid #eee;font-size:14px;line-height:1.6}.row:last-child{border:0}.muted{color:#777}.actions{display:flex;gap:9px;margin-top:14px}.actions .btn{flex:1;background:#fff;border:1px solid #ddd}.actions .primary{background:#171717;color:#fff;border-color:#171717}.note{font-size:12px;color:#888;line-height:1.7;margin-top:13px}
@media(max-width:820px){.cards{grid-template-columns:1fr 1fr}.panels{grid-template-columns:1fr}}@media(max-width:560px){.cards{grid-template-columns:1fr}.search{flex-direction:column}.hero h1{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="logo">还有多久</div><button class="city" onclick="changeCity()">📍 <span id="city">北京</span>　⌄</button></div>

<section id="home">
<section class="hero"><h1>吃饭还要等多久？</h1><p>按位置、菜系和评分筛选附近餐厅。</p>
<div class="search"><input id="search" placeholder="搜索餐厅或菜系，例如：火锅"><button onclick="render()">搜索</button></div>
<div class="filters">
<select id="cuisine" onchange="render()"><option value="">🍜 全部菜系</option><option>火锅</option><option>川菜</option><option>日料</option><option>烧烤</option><option>西餐</option></select>
<select id="rating" onchange="render()"><option value="0">⭐ 全部评分</option><option value="4.5">4.5分以上</option><option value="4">4.0分以上</option></select>
<select id="wait" onchange="render()"><option value="999">⏱️ 全部等位</option><option value="15">15分钟以内</option><option value="30">30分钟以内</option></select>
<select id="sort" onchange="render()"><option value="wait">等位最短</option><option value="rating">评分最高</option><option value="distance">距离最近</option></select>
</div></section>

<div class="location"><div><strong>📍 当前查看位置：<span id="locationText">北京市朝阳区</span></strong><br><small>附近餐厅结果将以此位置为中心</small></div><button class="btn" onclick="changeLocation()">更换位置</button></div>
<div class="map"><div class="road"></div><div class="road2"></div><div class="pin">📍</div></div>

<div class="title"><h2>附近餐厅</h2><span class="count" id="count"></span></div>
<div class="cards" id="cards"></div>
</section>

<section id="detail" class="detail">
<button class="back" onclick="showHome()">← 返回餐厅列表</button>
<div class="detailHero"><div class="detailPhoto" id="dIcon"></div><div class="detailInfo"><span class="tag" id="dCuisine"></span><div class="detailName" id="dName"></div><div id="dMeta"></div>
<div class="waitBox"><div><div class="waitNum" id="dWait"></div><div class="muted">当前预计等位时间</div></div><strong id="dStatus"></strong></div></div></div>
<div class="panels">
<div class="panel"><h2>⏱️ 等位趋势</h2><div class="chart"><div class="bar" style="height:42%"><span>11:00</span></div><div class="bar" style="height:60%"><span>12:00</span></div><div class="bar" style="height:82%"><span>13:00</span></div><div class="bar" style="height:91%"><span>14:00</span></div><div class="bar" style="height:65%"><span>15:00</span></div><div class="bar" style="height:48%"><span>现在</span></div></div><div class="note">演示版本：这里已经预留实时等位数据展示位置。</div></div>
<div class="panel"><h2>餐厅信息</h2><div class="row">📍 地址<br><span class="muted" id="dAddress"></span></div><div class="row">🕐 营业时间<br><span class="muted" id="dHours"></span></div><div class="row">💰 人均消费<br><span class="muted" id="dPrice"></span></div><div class="actions"><button class="btn" onclick="alert('下一版可接入地图导航 API')">🗺️ 导航</button><button class="btn primary" onclick="alert('下一版可接入真实排队/预约能力')">我想去这里</button></div></div>
</div></section>
</div>
<script>
const restaurants=[
{id:1,name:"海底捞火锅",cuisine:"火锅",rating:4.8,distance:.8,wait:12,price:120,icon:"🍲",address:"北京市朝阳区示例路 88 号",hours:"10:00 – 22:00"},
{id:2,name:"川味人家",cuisine:"川菜",rating:4.5,distance:1.2,wait:25,price:85,icon:"🌶️",address:"北京市朝阳区示例街 16 号",hours:"11:00 – 21:30"},
{id:3,name:"樱花日料",cuisine:"日料",rating:4.7,distance:1.5,wait:8,price:160,icon:"🍣",address:"北京市朝阳区樱花路 21 号",hours:"11:30 – 22:00"},
{id:4,name:"炭火烧肉屋",cuisine:"烧烤",rating:4.3,distance:1.8,wait:38,price:145,icon:"🥩",address:"北京市朝阳区炭火街 9 号",hours:"17:00 – 23:00"},
{id:5,name:"小巴黎餐厅",cuisine:"西餐",rating:4.6,distance:2.1,wait:18,price:210,icon:"🍝",address:"北京市朝阳区巴黎路 6 号",hours:"11:00 – 22:00"},
{id:6,name:"老成都火锅",cuisine:"火锅",rating:4.2,distance:2.4,wait:32,price:100,icon:"🥘",address:"北京市朝阳区成都路 33 号",hours:"10:30 – 22:30"}];
function cls(w){return w<=15?"green":w<=30?"yellow":"red"}
function render(){
let k=document.getElementById("search").value.trim().toLowerCase(),c=document.getElementById("cuisine").value,r=+document.getElementById("rating").value,w=+document.getElementById("wait").value,s=document.getElementById("sort").value;
let data=restaurants.filter(x=>(!k||x.name.toLowerCase().includes(k)||x.cuisine.includes(k))&&(!c||x.cuisine===c)&&x.rating>=r&&x.wait<=w);data.sort((a,b)=>a[s]-b[s]);
document.getElementById("count").textContent=`找到 ${data.length} 家`;
document.getElementById("cards").innerHTML=data.length?data.map(x=>`<article class="card"><div class="photo">${x.icon}</div><div class="body"><span class="tag">${x.cuisine}</span><div class="name">${x.name}</div><div class="meta">⭐ ${x.rating}　·　📍 ${x.distance} km　·　人均 ¥${x.price}</div><div class="bottom"><div class="wait ${cls(x.wait)}">${x.wait}<small> 分钟 · 预计等位</small></div><button class="btn" onclick="showDetail(${x.id})">查看详情</button></div></div></article>`).join(""):'<div class="empty">没有找到符合条件的餐厅</div>';
}
function showDetail(id){let x=restaurants.find(a=>a.id===id);if(!x)return;document.getElementById("home").style.display="none";document.getElementById("detail").style.display="block";document.getElementById("dIcon").textContent=x.icon;document.getElementById("dCuisine").textContent=x.cuisine;document.getElementById("dName").textContent=x.name;document.getElementById("dMeta").textContent=`⭐ ${x.rating}　·　📍 ${x.distance} km　·　人均 ¥${x.price}`;let q=document.getElementById("dWait");q.textContent=x.wait+" 分钟";q.className="waitNum "+cls(x.wait);document.getElementById("dStatus").textContent=x.wait<=15?"🟢 现在去":x.wait<=30?"🟡 建议稍等":"🔴 等位较久";document.getElementById("dAddress").textContent=x.address;document.getElementById("dHours").textContent=x.hours;document.getElementById("dPrice").textContent="约 ¥"+x.price+"/人";scrollTo(0,0)}
function showHome(){document.getElementById("detail").style.display="none";document.getElementById("home").style.display="block";scrollTo(0,0)}
function changeCity(){alert("演示版：下一版可以加入城市选择与地图定位。")}
function changeLocation(){alert("演示版：下一版可以接入地图 SDK，实现定位和拖动地图选位置。")}
render();
</script>
</body></html>

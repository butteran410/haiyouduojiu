<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>还有多久｜附近餐厅测试</title>
<style>
body{font-family:Arial,"Microsoft YaHei",sans-serif;margin:0;background:#f5f7fb;color:#222}
.box{max-width:900px;margin:24px auto;padding:22px;background:#fff;border-radius:16px;box-shadow:0 6px 24px #0001}
h1{margin-top:0}
.tip{padding:12px 14px;background:#fff7e6;border-radius:10px;line-height:1.6}
label{display:block;margin:14px 0 6px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:8px}
button{margin:14px 8px 0 0;padding:11px 17px;border:0;border-radius:8px;background:#1677ff;color:white;font-size:15px}
button:disabled{opacity:.6}
#status{margin:14px 0;font-weight:600}
#map{height:360px;border-radius:12px;overflow:hidden;background:#eee}
#list{margin-top:14px}
.card{padding:13px;border-bottom:1px solid #eee}
.name{font-weight:700;font-size:17px}
.meta{margin-top:5px;color:#666;font-size:14px;line-height:1.5}
.small{font-size:13px;color:#666;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<h1>还有多久｜附近真实餐厅测试</h1>
<div class="tip">
这是临时测试页，用来验证<strong>普通网络 → GitHub Pages → 高德 JS API → 附近餐厅 POI</strong>。
<br><strong>不要把安全密钥发给我，也不要把它写进 GitHub。</strong>
</div>

<label>高德 Web端(JS API) Key</label>
<input id="key" autocomplete="off" placeholder="粘贴“还有多久网页”的 Key">

<label>安全密钥 securityJsCode</label>
<input id="secret" type="password" autocomplete="off" placeholder="粘贴对应安全密钥">

<button id="btn" onclick="startTest()">开始测试</button>
<div id="status">等待测试……</div>
<div id="map"></div>
<div id="list"></div>

<p class="small">
测试会请求浏览器定位权限，并在当前位置附近搜索“餐厅”。只用于本次测试，不会把定位信息上传到本测试页。
</p>
</div>

<script>
function setStatus(msg){document.getElementById("status").textContent=msg;}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

async function startTest(){
  const key=document.getElementById("key").value.trim();
  const secret=document.getElementById("secret").value.trim();
  const btn=document.getElementById("btn");
  if(!key||!secret){setStatus("请先填写 Key 和安全密钥。");return;}

  btn.disabled=true;
  setStatus("正在加载高德 JS API……");
  window._AMapSecurityConfig={securityJsCode:secret};

  try{
    await new Promise((resolve,reject)=>{
      if(window.AMapLoader)return resolve();
      const s=document.createElement("script");
      s.src="https://webapi.amap.com/loader.js";
      s.onload=resolve;
      s.onerror=()=>reject(new Error("无法加载高德 JS API Loader"));
      document.head.appendChild(s);
    });

    const AMap=await AMapLoader.load({key,version:"2.0"});
    setStatus("JS API 鉴权成功。正在请求当前位置……");

    if(!navigator.geolocation) throw new Error("当前浏览器不支持定位");

    navigator.geolocation.getCurrentPosition(
      pos=>searchRestaurants(AMap,pos.coords.longitude,pos.coords.latitude),
      err=>{
        btn.disabled=false;
        setStatus("❌ 无法获取当前位置："+err.message+"。请允许浏览器使用定位权限后重试。");
      },
      {enableHighAccuracy:true,timeout:15000,maximumAge:60000}
    );
  }catch(e){
    btn.disabled=false;
    setStatus("❌ 测试失败："+(e?.message||String(e)));
  }
}

function searchRestaurants(AMap,lng,lat){
  setStatus("定位成功，正在搜索附近餐厅……");

  const map=new AMap.Map("map",{zoom:15,center:[lng,lat]});
  new AMap.Marker({map,position:[lng,lat],title:"你的位置"});

  AMap.plugin("AMap.PlaceSearch",function(){
    const placeSearch=new AMap.PlaceSearch({
      pageSize:20,
      pageIndex:1,
      type:"餐饮服务",
      map:map,
      autoFitView:false
    });

    placeSearch.searchNearBy("餐厅",[lng,lat],5000,function(status,result){
      if(status!=="complete" || !result || result.info!=="OK"){
        document.getElementById("list").innerHTML="<div class='card'>❌ 餐厅搜索失败："+escapeHtml(result?.info||status)+"</div>";
        setStatus("❌ 地图可以用，但附近餐厅搜索没有成功。");
        document.getElementById("btn").disabled=false;
        return;
      }

      const pois=result.poiList?.pois||[];
      document.getElementById("list").innerHTML=pois.length
        ? pois.map((p,i)=>`<div class="card"><div class="name">${i+1}. ${escapeHtml(p.name)}</div><div class="meta">📍 ${escapeHtml(p.address||"地址暂无")}<br>☎ ${escapeHtml(p.tel||"暂无")} ${p.distance!=null?"<br>↔ 距离约 "+escapeHtml(p.distance)+" 米":""}</div></div>`).join("")
        : "<div class='card'>没有找到附近餐厅。</div>";

      setStatus("✅ 测试成功：已经通过高德 JS API 获取附近真实餐厅！");
      document.getElementById("btn").disabled=false;
    });
  });
}
</script>
</body>
</html>
